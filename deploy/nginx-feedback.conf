# Initial HTTP-only server block. deploy/setup.sh substitutes the real domain
# in at deploy time (a nip.io domain by default, e.g. 192.0.2.10.nip.io — see
# deploy/README.md — or a real hoganguards.com subdomain later).
#
# Run `certbot --nginx -d <domain>` after this is in place — certbot rewrites
# this file in-place to add the TLS server block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name feedback.hoganguards.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
