# Initial HTTP-only server block.
# Run `certbot --nginx -d feedback.hoganguards.com` after this is in place —
# certbot rewrites this file in-place to add the TLS server block + redirect.
#
# Replace feedback.hoganguards.com everywhere below with the real subdomain
# before deploying, if a different one is chosen.

server {
    listen 80;
    listen [::]:80;
    server_name feedback.hoganguards.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
