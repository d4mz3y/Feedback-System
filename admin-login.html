<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hogan Guards</title>
    <link rel="icon" type="image/png" href="/hogan-favicon-transparent.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="feedback-card admin-login-card">
            <div class="admin-login-logo">
                <img src="/hogan-favicon-transparent.png" alt="Hogan Guards">
            </div>
            <h2 class="text-center">Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <div class="form-group admin-remember-me">
                    <label>
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        Remember me for 30 days
                    </label>
                </div>
                <button type="submit" class="btn btn-submit" id="submitBtn">Log In</button>
            </form>
            <div id="loginError" class="admin-error hidden"></div>
        </div>
    </div>
    <script src="/admin-login.js"></script>
</body>

</html>
